<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanji Quest — guardian roster</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:28px;background:#12151c;color:#e8ecf2;font:14px/1.5 system-ui,-apple-system,sans-serif}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:#93a0b4;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:1100px}
figure{margin:0;padding:14px 12px;border:1px solid #262c38;border-radius:12px;background:#181c25;text-align:center}
.cell{width:112px;height:112px;margin:0 auto}
figcaption b{display:block;font-size:13px;margin-top:10px}
figcaption small{color:#93a0b4;font-size:11px}

.guardian-sprite{position:relative;width:100%;height:100%;display:grid;place-items:center;--gs-1:#7a8b99;--gs-2:#4a5866;--gs-ink:rgba(6,10,16,.72);--gs-glow:#8fd9ff;--gs-eye:#fff8e6;--gs-pupil:#10151c}
.guardian-sprite svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .35rem .5rem rgba(0,0,0,.42))}
.gs-body,.gs-face,.gs-skull,.gs-gourd,.gs-hunch{fill:var(--gs-1);stroke:var(--gs-ink);stroke-width:2;stroke-linejoin:round}
.gs-shade{fill:var(--gs-2);opacity:.55;stroke:none}
.gs-hair,.gs-cloth,.gs-wisp{fill:var(--gs-2);stroke:var(--gs-ink);stroke-width:1.6;stroke-linejoin:round}
.gs-limb{fill:none;stroke:var(--gs-1);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.gs-rib,.gs-cloth-fold,.gs-brow,.gs-wrinkle,.gs-mark,.gs-tear{fill:none;stroke:var(--gs-ink);stroke-width:1.7;stroke-linecap:round;opacity:.62}
.gs-rope{fill:none;stroke:var(--gs-2);stroke-width:3;stroke-linecap:round}
.gs-eye{fill:var(--gs-eye);stroke:var(--gs-ink);stroke-width:1.4;transform-box:fill-box;transform-origin:50% 50%;animation:gs-blink 5.2s ease-in-out infinite}
.gs-pupil{fill:var(--gs-pupil)}
.gs-jaw,.gs-tongue,.gs-nose,.gs-snout,.gs-second-mouth{fill:var(--gs-ink);stroke:none}
.gs-fang{fill:#fff;stroke:none}
.gs-aura{fill:var(--gs-glow);opacity:.12;filter:blur(6px);animation:gs-aura-pulse 3.4s ease-in-out infinite}
.gs-sway{transform-box:fill-box;transform-origin:50% 0;animation:gs-sway 3.6s ease-in-out infinite}
.gs-float{transform-box:fill-box;transform-origin:50% 100%;animation:gs-float 2.9s ease-in-out infinite}
@keyframes gs-float{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-3px) rotate(.6deg)}}
@keyframes gs-sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
@keyframes gs-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes gs-aura-pulse{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.22;transform:scale(1.06)}}
.gs-first-morning{--gs-1:#7fae5c;--gs-2:#456b34;--gs-glow:#b6ff7a;--gs-eye:#fffbe0}
.gs-first-morning .gs-tongue{fill:#e0607f}
.gs-lunch-together{--gs-1:#b8a463;--gs-2:#6d5c30;--gs-glow:#ffe27a}
.gs-catch-the-train{--gs-1:#b5544f;--gs-2:#5f2724;--gs-glow:#ff8f7a}
.gs-lost-wallet{--gs-1:#e2dcd2;--gs-2:#6e6a74;--gs-glow:#cfd6ff;--gs-ink:rgba(20,18,26,.6)}
.gs-first-school-day{--gs-1:#c8503f;--gs-2:#2b2a30;--gs-glow:#ffa06a}
.gs-first-school-day .gs-wing{fill:#2b2a30;stroke:var(--gs-ink);stroke-width:1.5}
.gs-first-school-day .gs-nose{fill:#c8503f;stroke:var(--gs-ink);stroke-width:2}
.gs-first-school-day .gs-crest{fill:#d8b24a;stroke:var(--gs-ink);stroke-width:1.5}
.gs-rainy-day{--gs-1:#8fa9c4;--gs-2:#2f4358;--gs-glow:#9fd4ff}
.gs-rainy-day .gs-rain,.gs-rainy-day .gs-tear{fill:none;stroke:#9fd4ff;stroke-width:2;stroke-linecap:round;opacity:.75}
.gs-night-shift{--gs-1:#d9c9c2;--gs-2:#1d1a20;--gs-glow:#ff6b7d;--gs-eye:#fff}
.gs-night-shift .gs-slit{fill:#a8203a}
.gs-night-shift .gs-slit-line{fill:none;stroke:#a8203a;stroke-width:3;stroke-linecap:round}
.gs-night-shift .gs-scissors path{fill:none;stroke:#c9d2dc;stroke-width:3.4;stroke-linecap:round}
.gs-night-shift .gs-scissors circle{fill:none;stroke:#c9d2dc;stroke-width:3}
.gs-hospital-visit{--gs-1:#e8e4d8;--gs-2:#8d8878;--gs-glow:#ff9d4a;--gs-ink:rgba(28,24,20,.66)}
.gs-hospital-visit .gs-socket{fill:#241f1a}
.gs-hospital-visit .gs-emberlight{fill:#ff9d4a;stroke:none;filter:drop-shadow(0 0 4px #ff7a1a);animation:gs-ember 1.9s ease-in-out infinite}
.gs-hospital-visit .gs-nasal{fill:#241f1a;stroke:none}
.gs-hospital-visit .gs-teeth{fill:none;stroke:var(--gs-ink);stroke-width:2.2}
.gs-hospital-visit .gs-rib{stroke:#e8e4d8;stroke-width:3;opacity:.9}
.gs-festival-mask{--gs-1:#e08a3c;--gs-2:#f5ede0;--gs-glow:#ffd166}
.gs-festival-mask .gs-tails{fill:#e08a3c;stroke:var(--gs-ink);stroke-width:1.5;opacity:.94}
.gs-festival-mask .gs-ear{fill:#e08a3c;stroke:var(--gs-ink);stroke-width:1.6}
.gs-festival-mask .gs-ear-inner{fill:#f5c9a0;stroke:none}
.gs-festival-mask .gs-snout{fill:#f5ede0;stroke:var(--gs-ink);stroke-width:1.5}
.gs-festival-mask .gs-slitpupil{fill:none;stroke:var(--gs-pupil);stroke-width:3.4;stroke-linecap:round}
.gs-festival-mask .gs-mark{stroke:#a8452a;opacity:.8}
.gs-festival-mask .gs-foxfire circle{fill:#8fd9ff;opacity:.75;filter:drop-shadow(0 0 5px #4fb8ff);animation:gs-foxfire 2.6s ease-in-out infinite}
.gs-festival-mask .gs-foxfire circle:nth-child(2){animation-delay:-.9s}
.gs-festival-mask .gs-foxfire circle:nth-child(3){animation-delay:-1.7s}
.gs-empty-apartment{--gs-1:#eef4f6;--gs-2:#20242c;--gs-glow:#bfe9ff;--gs-ink:rgba(24,32,44,.5)}
.gs-empty-apartment svg{opacity:.9}
.gs-empty-apartment .gs-wisp{fill:#eef4f6;opacity:.72}
.gs-empty-apartment .gs-hollow{fill:#20242c;stroke:none}
.gs-empty-apartment .gs-triangle{fill:#f7fbfd;stroke:var(--gs-ink);stroke-width:1.4}
.gs-empty-apartment .gs-droop{stroke:#eef4f6;stroke-width:4;opacity:.85}
.gs-mountain-path{--gs-1:#9a8aa8;--gs-2:#d9d4e0;--gs-glow:#c9a6ff}
.gs-mountain-path .gs-hair{fill:#d9d4e0}
.gs-mountain-path .gs-second-mouth{fill:#5a1f36}
.gs-hollow-lantern{--gs-1:#c9b6d8;--gs-2:#3a2450;--gs-glow:#d4a72c;--gs-eye:#fff4d0}
.gs-hollow-lantern .gs-kesa{fill:#d4a72c;stroke:var(--gs-ink);stroke-width:1.4}
.gs-hollow-lantern .gs-beard{fill:#e8e2ee;stroke:var(--gs-ink);stroke-width:1.4}
.gs-hollow-lantern .gs-cup{fill:#e8e2ee;stroke:var(--gs-ink);stroke-width:1.6}
.gs-hollow-lantern .gs-cup-handle{fill:none;stroke:#e8e2ee;stroke-width:2.4}
.gs-hollow-lantern .gs-steam{fill:none;stroke:#e8e2ee;stroke-width:1.6;stroke-linecap:round;opacity:.6}
.gs-hollow-lantern .gs-boss-aura{opacity:.2;animation:gs-aura-pulse 2.2s ease-in-out infinite}
.gs-hollow-lantern .gs-boss-eye{filter:drop-shadow(0 0 4px #d4a72c)}
@keyframes gs-ember{0%,100%{opacity:.75;r:3.4}50%{opacity:1;r:4.4}}
@keyframes gs-foxfire{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:.95;transform:translateY(-6px)}}
</style>
</head>
